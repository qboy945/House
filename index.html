<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>房仲神隊友｜一鍵多平台文案轉換機</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #16a34a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .container { max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 20px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 800; color: #1e293b; }
  .subtitle { font-size: 13px; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
  input[type="text"], input[type="tel"], textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
    background: #fff;
    font-family: inherit;
  }
  input:focus, textarea:focus { border-color: var(--primary); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .tags-wrapper { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag-btn {
    border: 1px solid var(--border);
    background: #f1f5f9;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .tag-btn.active {
    background: #eff6ff;
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }
  .btn-submit {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(37,99,235,0.25);
  }
  .demo-fill { text-align: right; margin-bottom: 8px; }
  .demo-fill a { color: var(--primary); font-size: 12px; text-decoration: underline; cursor: pointer; }
  .output-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
  .tab-btn {
    flex: 1; min-width: 90px; text-align: center; padding: 10px 8px;
    background: #e2e8f0; border: none; border-radius: 10px; font-size: 13px; font-weight: 600;
    color: #475569; cursor: pointer; white-space: nowrap;
  }
  .tab-btn.active { background: #1e293b; color: white; }
  .output-box {
    position: relative; background: #f8fafc; border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; min-height: 220px;
  }
  .output-text { white-space: pre-wrap; font-size: 14px; line-height: 1.65; color: #1e293b; margin: 0; word-break: break-all; }
  .btn-copy {
    float: right; margin-top: 10px; background: #0f172a; color: white; border: none;
    padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-copy.copied { background: var(--success); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏠 房仲一鍵文案神器</h1>
    <div class="subtitle">填一次資料 ➔ 自動生成【FB爆款 / 591規格 / LINE推坑 / IG吸睛】</div>
  </header>
  <div class="card"
    >
    <div class="demo-fill"><a onclick="fillDemo()">⚡ 帶入示範物件</a></div>
    <div class="grid-2">
      <div class="form-group"><label>社區/案名/地段</label><input type="text" id="title
                                     " placeholder="例：新巨蛋、近府中捷運"></div>
      <div class="form-group"><label>開價 (萬元)</label><input type="text" id="price" placeholder="例：2380"></div>
    </div>
    <div class="grid-3">
      <div class="form-group"><label>格局</label><input type="text" id="layout" placeholder="例：2房2廳1衛"></div>
      <div class="form-group"><label>總建坪</label><input type="text" id="ping" placeholder="例：28.5坪"></div>
      <div class="form-group"><label>樓層/總樓高</label><input type="text" id="floor" placeholder="例：12F/38F"></div>
    </div>
    <div class="form-group">
      <label>必殺賣點（點擊快速加入）</label>
      <div class="tags-wrapper">
        <span class="tag-btn" onclick="toggleTag(this, '捷運共構秒到站')">🚇 捷運共構</span>
        <span class="tag-btn" onclick="toggleTag(this, '屋主換屋誠意出售')">🤝 屋主誠售</span>
        <span class="tag-btn" onclick="toggleTag(this, '高樓景觀邊間採光')">☀️ 景觀採光</span>
        <span class="tag-btn" onclick="toggleTag(this, '稀有釋出動作要快')">🔥 稀有釋出</span>
        <span class="tag-btn" onclick="toggleTag(this, '精美裝潢可直接入住')">🛋️ 精美裝潢</span>
        <span class="tag-btn" onclick="toggleTag(this, '低總價新青安首選')">💰 新青安首選</span>
      </div>
    </div>
    <div class="form-group"><label>其他備註特色</label><textarea id="features" rows="2" placeholder="例：坡道平面大車位、近學區生活機能極佳"></textarea></div>
    <div class="grid-2">
      <div class="form-group"><label>經紀人稱呼</label><input type="text" id="agentName" placeholder="例：永慶小陳"></div>
      <div class="form-group"><label>電話 / LINE ID</label><input type="tel" id="contact" placeholder="例：0912-345-678"></div>
    </div>
    <button class="btn-submit" onclick="generateAll()">✨ 一鍵生成 4 大平台文案</button>
  </div>
  <div class="card" id="resultCard" style="display:none;">
    <div class="output-tabs">
      <button class="tab-btn active" onclick="switchTab(0)">🔥 FB 社團爆款</button>
      <button class="tab-btn" onclick="switchTab(1)">📋 591規格</button>
      <button class="tab-btn" onclick="switchTab(2)">💬 LINE 推坑</button>
      <button class="tab-btn" onclick="switchTab(3)">📸 IG吸睛短文</button>
    </div>
    <div class="output-box">
      <pre class="output-text" id="outputText"></pre>
      <button class="btn-copy" id="copyBtn" onclick="copyResult()">📋 複製此文案</button>
    </div>
  </div>
</div>                  
  <script>
let selectedTags = [];
let copies = [];
let currentTabIndex = 0;

function toggleTag(el, text) {
  el.classList.toggle('active');
  if (el.classList.contains('active')) {
    selectedTags.push(text);
  } else {
    selectedTags = selectedTags.filter(t => t !== text);
  }
}

function fillDemo() {
  document.getElementById('title').value = '新巨蛋捷運共構超美高樓兩房';
  document.getElementById('price').value = '2380';
  document.getElementById('layout').value = '2房2廳1衛1陽台';
  document.getElementById('ping').value = '28.6坪';
  document.getElementById('floor').value = '18F / 46F';
  document.getElementById('features').value = '附坡道平面車位、新婚首購首選、收租投報率佳、出站即到家！';
  document.getElementById('agentName').value = '板橋買房推薦 阿宏';
  document.getElementById('contact').value = '0988-123-456 (LINE: honghouse)';
  document.querySelectorAll('.tag-btn').forEach(btn => {
    if (btn.innerText.includes('捷運') || btn.innerText.includes('景觀') || btn.innerText.includes('屋主')) {
      if (!btn.classList.contains('active')) btn.click();
    }
  });
}

function generateAll() {
  const title = document.getElementById('title').value.trim() || '優質稀有美物件';
  const price = document.getElementById('price').value.trim();
  const priceStr = price ? `${price} 萬` : '屋主誠意價 歡迎洽詢';
  const layout = document.getElementById('layout').value.trim() || '依現況';
  const ping = document.getElementById('ping').value.trim() || '依權狀';
  const floor = document.getElementById('floor').value.trim() || '高樓層';
  const customFeatures = document.getElementById('features').value.trim();
  const agent = document.getElementById('agentName').value.trim() || '專案經紀人';
  const contact = document.getElementById('contact').value.trim() || '私訊洽詢';

  const allTags = [...selectedTags];
  if (customFeatures) allTags.push(customFeatures);
  const tagListStr = allTags.map(t => `✅ ${t}`).join('
');

  const fbCopy = `🔥【屋主決心要賣！降價通知・錯過不再】🔥
━━━━━━━━━━━━━━━━━━━━━
📍 物件名稱：${title}
💰 震撼開價：${priceStr}（勇敢出價，我幫你談！）
📐 權狀坪數：${ping}
🛏 格局規劃：${layout}
🏢 樓層位置：${floor}

【為什麼這間值得你親自來看？】
${tagListStr || '✅ 屋況極佳 免大整理
✅ 地段保值 生活機能成熟'}

屋主因生涯規劃換屋，這間起家厝真的顧得很好！
現場看光線跟通風比照片好太多，同行都在帶看了，慢了只能恭喜別人！

━━━━━━━━━━━━━━━━━━━━━
📲 預約帶看專線：${contact}
👤 服務經紀人：${agent}
⚡ 買屋賣屋・行情諮詢・委託找房 歡迎直接私訊！
#買房 #成家 #換屋 #新青安 #好房推薦`;

  const portalCopy = `【${title}】

【基本資料】
・總價：${priceStr}
・建物格局：${layout}
・建物登記：${ping}
・所在樓層：${floor}

【物件亮點】
${allTags.map((t, idx) => `${idx+1}. ${t}`).join('
') || '1. 格局方正，採光佳通風良好
2. 生活機能成熟便利'}

【經紀人貼心提醒】
現場看屋感受最準確，歡迎提前預約帶看，為您提供最完整的產權調查與周邊成交行情分析！

預約賞屋請洽：${agent}
賞屋專線：${contact}`;

  const lineCopy = `哥/姐您好！我是 ${agent} 😊
跟您分享一間今天剛接到的好案子，第一時間先傳給您參考：

🏠【${title}】
・開價：${priceStr}
・格局：${layout}（${ping}）
・樓層：${floor}

💡 重點特色：
${allTags.slice(0, 3).map(t => `👉 ${t}`).join('
') || '👉 屋況超好，地段無可挑剔'}

這間採光跟動線真的很漂亮，屋主也很客氣好談，我覺得很適合您的需求！
這兩天您有空嗎？我帶您現場走走感受一下，不喜歡也沒關係當作看行情！
可以直接加我電話或私訊約時間喔：${contact}`;

  const igCopy = `✨ 找到屬於你的理想生活提案 🏠

「回家的路上，連風都是溫柔的。」
今天帶看這間【${title}】真的被驚豔到！

總價｜${priceStr}
空間｜${layout}・${ping}・${floor}
亮點｜
${allTags.slice(0, 4).map(t => `▫️ ${t}`).join('
') || '▫️ 陽光灑落的大客廳
▫️ 步行可達的便利日常'}

有時候買房買的不是坪數，而是每天下班後真正能放鬆的自己。
想看完整開箱影片或現場感受嗎？

歡迎小盒子私訊 📥
專案諮詢｜${agent}（${contact}）
.
#房地產 #買房筆記 #看房日記 #首購族 #我的神仙房子`;

  copies = [fbCopy, portalCopy, lineCopy, igCopy];
  document.getElementById('resultCard').style.display = 'block';
  switchTab(currentTabIndex);
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
}

function switchTab(index) {
  currentTabIndex = index;
  document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', idx === index);
  });
  document.getElementById('outputText').textContent = copies[index] || '';
  const copyBtn = document.getElementById('copyBtn');
  copyBtn.innerHTML = '📋 複製此文案';
  copyBtn.classList.remove('copied');
}

function copyResult() {
  const text =f (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    co document.getElementById('outputText').textContent;
  inst btn = document.getElementById('copyBtn');
    btn.innerHTML = '✅ 已複製到剪貼簿！';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = '📋 複製此文案';
      btn.classList.remove('copied');
    }, 2000);
  });
}
</script>
</body>
</html>
