<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>房仲神隊友｜一鍵多平台文案轉換機</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #16a34a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .container { max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 20px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 800; color: #1e293b; }
  .subtitle { font-size: 13px; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
  input[type="text"], input[type="tel"], textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
    background: #fff;
    font-family: inherit;
  }
  input:focus, textarea:focus { border-color: var(--primary); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .tags-wrapper { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag-btn {
    border: 1px solid var(--border);
    background: #f1f5f9;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s;
  }
  .tag-btn.active {
    background: #eff6ff;
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }
  .btn-submit {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(37,99,235,0.25);
  }
  .demo-fill { text-align: right; margin-bottom: 8px; }
  .demo-fill a { color: var(--primary); font-size: 12px; text-decoration: underline; cursor: pointer; }
  .output-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
  .tab-btn {
    flex: 1; min-width: 90px; text-align: center; padding: 10px 8px;
    background: #e2e8f0; border: none; border-radius: 10px; font-size: 13px; font-weight: 600;
    color: #475569; cursor: pointer; white-space: nowrap;
  }
  .tab-btn.active { background: #1e293b; color: white; }
  .output-box {
    position: relative; background: #f8fafc; border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; min-height: 220px;
  }
  .output-text { white-space: pre-wrap; font-size: 14px; line-height: 1.65; color: #1e293b; margin: 0; word-break: break-all; }
  .btn-copy {
    float: right; margin-top: 10px; background: #0f172a; color: white; border: none;
    padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-copy.copied { background: var(--success); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏠 房仲一鍵文案神器</h1>
    <div class="subtitle">填一次資料 ➔ 自動生成【FB爆款 / 591規格 / LINE推坑 / IG吸睛】</div>
  <p class="subtitle">本機模板工具，非 AI；不會傳送資料至外部服務。刊登前請核對價格、坪數、屋況與廣告必要資訊。</p>
  </header>
  <div class="card"
    >
    <div class="demo-fill"><a onclick="fillDemo()">⚡ 帶入示範物件</a></div>
    <div class="grid-2">
      <div class="form-group"><label>社區/案名/地段</label><input type="text" id="title" placeholder="例：新巨蛋、近府中捷運"></div>
      <div class="form-group"><label>開價 (萬元)</label><input type="text" id="price" placeholder="例：2380"></div>
    </div>
    <div class="grid-3">
      <div class="form-group"><label>格局</label><input type="text" id="layout" placeholder="例：2房2廳1衛"></div>
      <div class="form-group"><label>總建坪</label><input type="text" id="ping" placeholder="例：28.5坪"></div>
      <div class="form-group"><label>樓層/總樓高</label><input type="text" id="floor" placeholder="例：12F/38F"></div>
    </div>
    <div class="form-group">
      <label>物件特色（僅勾選已確認的事實）</label>
      <div class="tags-wrapper">
        <span class="tag-btn" onclick="toggleTag(this, '捷運共構秒到站')">🚇 捷運共構</span>
        <span class="tag-btn" onclick="toggleTag(this, '屋主誠意出售')">🤝 屋主誠售</span>
        <span class="tag-btn" onclick="toggleTag(this, '高樓景觀邊間採光')">☀️ 景觀採光</span>
        <span class="tag-btn" onclick="toggleTag(this, '稀有釋出動作要快')">🔥 稀有釋出</span>
        <span class="tag-btn" onclick="toggleTag(this, '精美裝潢可直接入住')">🛋️ 精美裝潢</span>
        <span class="tag-btn" onclick="toggleTag(this, '貸款條件請另行洽詢')">💰 貸款洽詢</span>
      </div>
    </div>
    <div class="form-group"><label>其他備註特色</label><textarea id="features" rows="2" placeholder="例：坡道平面大車位、近學區生活機能極佳"></textarea></div>
    <div class="grid-2">
      <div class="form-group"><label>經紀人稱呼</label><input type="text" id="agentName" placeholder="例：永慶小陳"></div>
      <div class="form-group"><label>電話 / LINE ID</label><input type="tel" id="contact" placeholder="例：0912-345-678"></div>
    </div>
    <button class="btn-submit" onclick="generateAll()">✨ 一鍵生成 4 大平台文案</button>
  </div>
  <div class="card" id="resultCard" style="display:none;">
    <div class="output-tabs">
      <button class="tab-btn active" onclick="switchTab(0)">🔥 FB 社團爆款</button>
      <button class="tab-btn" onclick="switchTab(1)">📋 591規格</button>
      <button class="tab-btn" onclick="switchTab(2)">💬 LINE 推坑</button>
      <button class="tab-btn" onclick="switchTab(3)">📸 IG吸睛短文</button>
    </div>
    <p class="subtitle">以下為模板草稿，刊登前請核對；示範資料不代表真實待售物件。</p>
    <button onclick="window.print()">🖨️ 列印 / 儲存 PDF</button>
    <div class="output-box">
      <pre class="output-text" id="outputText"></pre>
      <button class="btn-copy" id="copyBtn" onclick="copyResult()">📋 複製此文案</button>
    </div>
    <p id="copyStatus" class="subtitle" role="status" aria-live="polite"></p>
  </div>
</div>                  
  <script>
let selectedTags = [];
let copies = [];
let currentTabIndex = 0;
let copyRequest = 0;

function toggleTag(el, text) {
  el.classList.toggle('active');
  if (el.classList.contains('active')) {
    selectedTags.push(text);
  } else {
    selectedTags = selectedTags.filter(t => t !== text);
  }
}

function fillDemo() {
  document.getElementById('title').value = '【示範】捷運景觀兩房（非真實物件）';
  document.getElementById('price').value = '2380';
  document.getElementById('layout').value = '2房2廳1衛1陽台';
  document.getElementById('ping').value = '28.6坪';
  document.getElementById('floor').value = '18F / 46F';
  document.getElementById('features').value = '【示範資料】附坡道平面車位；實際條件請核對。';
  document.getElementById('agentName').value = '示範業務';
  document.getElementById('contact').value = '請填入您的聯絡方式';
  
  selectedTags = [];
  document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
}

function generateAll() {
  const title = document.getElementById('title').value.trim() || '物件名稱未提供';
  const price = document.getElementById('price').value.trim();
  const priceStr = price ? `${price} 萬` : '未提供，歡迎洽詢';
  const layout = document.getElementById('layout').value.trim() || '未提供';
  const ping = document.getElementById('ping').value.trim() || '未提供';
  const floor = document.getElementById('floor').value.trim() || '未提供';
  const customFeatures = document.getElementById('features').value.trim();
  const agent = document.getElementById('agentName').value.trim() || '聯絡人未提供';
  const contact = document.getElementById('contact').value.trim() || '聯絡方式未提供，請補填';

  const allTags = [...selectedTags];
  if (customFeatures) allTags.push(customFeatures);
  const tagListStr = allTags.map(t => `✅ ${t}`).join('\n');

  // 1. FB 社團爆款版 (吸睛、痛點、表情符號、標籤豐富)
  const fbCopy = `🏠【物件資訊分享】
━━━━━━━━━━━━━━━━━━━━━
📍 物件名稱：${title}
💰 開價：${priceStr}
📐 權狀坪數：${ping}
🛏 格局規劃：${layout}
🏢 樓層位置：${floor}

【為什麼這間值得你親自來看？】
${tagListStr || '特色未提供，歡迎洽詢'}

想進一步了解物件條件，歡迎洽詢並預約現場確認。

━━━━━━━━━━━━━━━━━━━━━
📲 預約帶看專線：${contact}
👤 服務經紀人：${agent}
⚡ 買屋賣屋・行情諮詢・委託找房 歡迎直接私訊！
#買房 #成家 #物件資訊`;

  // 2. 591 / 樂屋網 規格版 (清楚、專業、條理化、符合房仲公會審核風格)
  const portalCopy = `【${title}】

【基本資料】
・總價：${priceStr}
・建物格局：${layout}
・建物登記：${ping}
・所在樓層：${floor}

【物件亮點】
${allTags.map((t, idx) => `${idx+1}. ${t}`).join('\n') || '特色未提供，歡迎洽詢'}

【經紀人貼心提醒】
價格、坪數、產權與現況請核對相關資料，歡迎洽詢看屋安排。

預約賞屋請洽：${agent}
賞屋專線：${contact}`;

  // 3. LINE 私訊推坑版 (口語、像朋友報好康、無壓力)
  const lineCopy = `哥/姐您好！我是 ${agent} 😊
跟您分享一筆物件資訊，供您參考：

🏠【${title}】
・開價：${priceStr}
・格局：${layout}（${ping}）
・樓層：${floor}

💡 重點特色：
${allTags.slice(0, 3).map(t => `👉 ${t}`).join('\n') || '👉 特色未提供，歡迎洽詢'}

是否符合您的需求，建議確認資料並現場看屋。
這兩天您有空嗎？我帶您現場走走感受一下，不喜歡也沒關係當作看行情！
可以直接加我電話或私訊約時間喔：${contact}`;

  // 4. IG / 小紅書吸睛版 (文青短句、Hashtags、視覺感)
  const igCopy = `✨ 找到屬於你的理想生活提案 🏠

「回家的路上，連風都是溫柔的。」
本次物件分享：【${title}】

總價｜${priceStr}
空間｜${layout}・${ping}・${floor}
亮點｜
${allTags.slice(0, 4).map(t => `▫️ ${t}`).join('\n') || '▫️ 特色未提供，歡迎洽詢'}

有時候買房買的不是坪數，而是每天下班後真正能放鬆的自己。
想了解更多物件資訊或洽詢看屋安排嗎？

歡迎小盒子私訊 📥
專案諮詢｜${agent}（${contact}）
.
.
#房地產 #買房筆記 #看房日記 #裝潢靈感 #首購族 #我的神仙房子`;

  copies = [fbCopy, portalCopy, lineCopy, igCopy];

  document.getElementById('resultCard').style.display = 'block';
  switchTab(currentTabIndex);
  
  // 平滑滾動到結果
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
}

function switchTab(index) {
  copyRequest++;
  document.getElementById('copyStatus').textContent = '';
  currentTabIndex = index;
  document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', idx === index);
  });
  document.getElementById('outputText').textContent = copies[index] || '';
  
  const copyBtn = document.getElementById('copyBtn');
  copyBtn.innerHTML = '📋 複製此文案';
  copyBtn.classList.remove('copied');
}

async function copyResult() {
  const text = document.getElementById('outputText').textContent;
  if (!text) return;
  const request = ++copyRequest;
  let copied = false;
  try {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      await navigator.clipboard.writeText(text);
      copied = true;
    }
  } catch (_) { /* Permission denied: try the legacy fallback. */ }
  if (!copied) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;';
    const previousFocus = document.activeElement;
    document.body.appendChild(textarea);
    try {
      textarea.focus();
      textarea.select();
      textarea.setSelectionRange(0, text.length);
      copied = typeof document.execCommand === 'function' && document.execCommand('copy') === true;
    } catch (_) { copied = false; }
    finally {
      textarea.remove();
      if (previousFocus && previousFocus.focus) previousFocus.focus();
    }
  }
  // A delayed clipboard response must not label a different tab as copied.
  if (request !== copyRequest) return;
  const btn = document.getElementById('copyBtn');
  btn.textContent = copied ? '✅ 已複製到剪貼簿！' : '📋 重試複製';
  btn.classList.toggle('copied', copied);
  document.getElementById('copyStatus').textContent = copied
    ? '已複製目前文案。'
    : '無法自動複製；請長按上方文案選取文字，或以滑鼠選取後手動複製。';
}
</script>
</body>
</html>
